plugins { id 'com.android.application' }
android {
 namespace 'com.group15.studydesk'
 compileSdk 36
 defaultConfig { applicationId 'com.group15.studydesk'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.17.0-java.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildTypes {
  release {
   // Use Android's local debug signing configuration for this coursework/demo build.
   // Android creates the key on each machine; no user directory or key is shared.
   signingConfig signingConfigs.debug
  }
 }
 buildFeatures { viewBinding true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
